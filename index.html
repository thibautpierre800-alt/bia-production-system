<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3440">
  <meta name="description" content="BIA Operating System V5 — système d'excellence opérationnelle multisite">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>BIA Operating System V5</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">BIA</span><span>Operating System</span><small>Excellence opérationnelle</small></div>
      <nav id="desktopNav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot"><span class="live-dot"></span><span id="syncLabel">Mode local</span><small>V5.0</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="mobile-brand">BIA <span>OS · V5</span></div>
        <div class="context">
          <label class="site-control"><span>Site actif</span><select id="siteSelect" aria-label="Site actif"></select></label>
          <button class="icon-button" id="refreshBtn" title="Actualiser" aria-label="Actualiser">↻</button>
          <button class="profile-button" data-nav="account" aria-label="Compte"><span id="profileInitials">PT</span></button>
        </div>
      </header>
      <main id="main" class="main-content" tabindex="-1">
        <div class="mode-banner" id="dataMode" role="status"></div>
        <section class="view active" id="homeView"></section>
        <section class="view" id="controlView"></section>
        <section class="view" id="kpiView"></section>
        <section class="view" id="actionsView"></section>
        <section class="view" id="gembaView"></section>
        <section class="view" id="auditsView"></section>
        <section class="view" id="improveView"></section>
        <section class="view" id="practicesView"></section>
        <section class="view" id="toolsView"></section>
        <section class="view" id="accountView"></section>
      </main>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="Navigation mobile"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal-backdrop" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalContent"></div></div></div>
  <script src="config.js"></script>
  <script src="library.js"></script>
  <script src="app.js"></script>
</body>
</html>
