<body>

  const SITES=[

  let db=null, session=null, profile=null, active='home', siteId=localStorage.biaV3Site||'marzin';

  const current=()=>SITES.find(s=>s.id===siteId)||SITES[0]; const isOnline=()=>!!session; const isAdmin=()=>profile?.role==='admin'; const isManager=()=>['manager','admin'].includes(profile?.role);
  function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').hidden=true,3200)}
  function siteOptions(){return SITES.map(s=>`<option value="${s.id}" ${s.id===siteId?'selected':''}>${esc(s.name)}</option>`).join('')}

  </script>
  <script>
  /* Grille d'audit Excellence Opérationnelle Multisite, inspirée du support Groupe. */
  const EXCELLENCE_DOMAINS=[
    ['Sécurité',['Port des EPI','Analyse des risques','Gestion des presqu’accidents','Standards sécurité','Audits sécurité']],
    ['Production',['Respect du planning','Productivité','Gestion des arrêts','Management visuel','Standards de travail']],
    ['Qualité',['Gestion des non-conformités','Réclamations clients','Contrôles qualité','Traçabilité','Plan d’actions']],
    ['Maintenance',['Maintenance préventive','Analyse des pannes','Disponibilité machines','Gestion des pièces de rechange','TPM']],
    ['Logistique',['Flux matières','Gestion des stocks','Ruptures','Inventaires','Fiabilité ERP']],
    ['Achats',['Suivi fournisseurs','Respect des délais','Double sourcing','Gestion des urgences','Performance fournisseurs']],
    ['Bureau d’études / Industrialisation',['Gestion des modifications','Respect des délais','Standardisation','Capitalisation REX','Gestion des projets']],
    ['Ressources humaines',['Polyvalence','Formation','Intégration','Absentéisme','Compétences critiques']],
    ['Management',['KPI','Réunions quotidiennes','Pilotage des actions','Communication','Leadership terrain']],
    ['Amélioration continue',['A3','5 Pourquoi','Kaizen','Audits Gemba','Yokoten']]
  ];
  let excellenceDraft=JSON.parse(localStorage.biaExcellenceDraft||'{}');
  function maturity(score){return score<1?'Initial':score<2?'Développement':score<3?'Structuré':score<4?'Maîtrisé':'Excellence'}
  function scoreTone(score){return score<2?'danger':score<3?'warn':'ok'}
  function auditRow(d,di,ci){let key=`${di}-${ci}`,v=excellenceDraft.scores?.[key]??'',pr=excellenceDraft.priorities?.[key]||'';return `<div class="ex-row"><div><b>${di+1}.${ci+1}</b> ${esc(d[1][ci])}</div><select data-audit-score="${key}"><option value="">–</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${String(v)===String(n)?'selected':''}>${n}</option>`).join('')}</select><input data-audit-note="${key}" value="${esc(excellenceDraft.notes?.[key]||'')}" placeholder="Preuve / observation"><select data-audit-priority="${key}"><option value="">Priorité</option>${['Rouge','Orange','Vert'].map(p=>`<option value="${p}" ${pr===p?'selected':''}>${p}</option>`).join('')}</select></div>`}
  function excellenceSummary(){let scores=excellenceDraft.scores||{}, domain=EXCELLENCE_DOMAINS.map((d,di)=>d[1].reduce((n,_,ci)=>n+(Number(scores[`${di}-${ci}`])||0),0)), total=domain.reduce((n,v)=>n+v,0), average=total/50;return {domain,total,average}}
  function renderAudits(){let a=auditsForSite(),sum=excellenceSummary();$('auditsView').innerHTML=`<p class="eyebrow">Référentiel Groupe</p><div class="section-title"><div><h1>Audits</h1><p class="intro">Une grille unique, un score automatique, des actions directement exploitables.</p></div><button class="btn" id="openExcellence">＋ Audit Excellence</button></div><div class="audit-grid"><div class="card"><div class="caps">Audit Excellence Opérationnelle</div><div class="audit-score">${sum.total}<small style="font-size:14px"> / 250</small></div><div class="scorebar"><span style="width:${sum.total/2.5}%"></span></div><p class="hint">Niveau actuel : <b>${maturity(sum.average)}</b> · 10 domaines évalués</p></div><div class="card"><div class="caps">Automatisations intégrées</div><p class="hint">Score global, niveau de maturité, synthèse par domaine, priorités Rouge/Orange/Vert, forces et plan d’actions sont produits à partir de la grille.</p><button class="btn quiet" id="openExcellence2">Ouvrir une feuille vierge</button></div></div><form class="excellence-sheet" id="excellenceForm" hidden><div class="audit-head"><div><div class="brand-blue">BIA · AUDIT EXCELLENCE OPÉRATIONNELLE MULTISITE</div><p class="hint">Grille digitale dérivée du référentiel Groupe · échelle de maturité de 0 à 5</p></div><div class="audit-global"><b id="globalScore">${sum.total} / 250</b><span id="globalMaturity">${maturity(sum.average)}</span></div></div><div class="audit-meta"><label>Site audité<select id="auditSite">${siteOptions()}</select></label><label>Date<input id="auditDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Responsable de secteur<input id="auditResponsible" value="${esc(excellenceDraft.responsible||'')}"></label><label>Auditeur<input id="auditAuditor" value="${esc(excellenceDraft.auditor||'')}"></label><label>Équipe d’audit<input id="auditTeam" value="${esc(excellenceDraft.team||'')}"></label><label>Processus / périmètre<input id="auditPerimeter" value="${esc(excellenceDraft.perimeter||'')}" placeholder="Ex. Atelier usinage"></label></div><div class="maturity-legend"><b>Échelle : </b>0 Inexistant · 1 Très faible · 2 Insuffisant · 3 Acceptable · 4 Maîtrisé · 5 Excellence</div><div class="excellence-body"><div class="excellence-domains">${EXCELLENCE_DOMAINS.map((d,di)=>`<section class="domain-card"><div class="domain-title"><span>${di+1}</span><div><h3>${esc(d[0])}</h3><small id="domainScore-${di}">${sum.domain[di]} / 25</small></div></div><div class="ex-criteria"><div class="ex-labels"><span>Critère</span><span>Score</span><span>Preuve / observation</span><span>Priorité</span></div>${d[1].map((_,ci)=>auditRow(d,di,ci)).join('')}</div></section>`).join('')}</div><aside class="audit-side"><h3>Synthèse par domaine</h3><div id="domainSummary">${domainSummary(sum)}</div><h3 style="margin-top:18px">Radar de maturité</h3><div class="radar" id="radar">${sum.domain.map((x,i)=>`<div><span>${i+1}</span><i style="height:${Math.max(5,x/25*100)}%"></i></div>`).join('')}</div><p class="hint">Le radar se met à jour automatiquement.</p></aside></div><div class="audit-notes"><label>Forces<textarea id="auditStrengths" rows="3" placeholder="Points forts à maintenir"></textarea></label><label>Faiblesses<textarea id="auditWeaknesses" rows="3" placeholder="Points d’amélioration"></textarea></label><label>Opportunités<textarea id="auditOpportunities" rows="3" placeholder="Leviers / bonnes pratiques détectées"></textarea></label><label>Actions prioritaires<textarea id="auditActions" rows="3" placeholder="Plan d’actions 90 jours"></textarea></label></div><div class="form-footer"><button class="btn">Enregistrer l’audit et créer le plan d’actions</button><button type="button" class="btn secondary" id="saveDraft">Enregistrer le brouillon</button><button type="button" class="btn secondary" id="closeExcellence">Fermer</button></div></form><div class="section"><div class="section-title"><h2>Audits enregistrés</h2><span class="badge">${a.length} éléments</span></div><div class="list">${a.map(x=>`<article class="row"><div class="card-top">${status(x.status)} ${x.score?`<span class="pill published">${x.score}/250</span>`:''}</div><div class="row-title">${esc(x.notes||'Audit Excellence')}</div><div class="row-meta">${new Date(x.performed_at).toLocaleDateString('fr-FR')}</div></article>`).join('')||empty('Aucun audit enregistré.')}</div></div></form>`;bindExcellence()}
  function domainSummary(sum){return EXCELLENCE_DOMAINS.map((d,i)=>`<div class="domain-summary"><span>${i+1}. ${esc(d[0])}</span><b class="${scoreTone(sum.domain[i]/5)}">${sum.domain[i]}/25</b></div>`).join('')}
  function refreshExcellence(){let sum=excellenceSummary();$('globalScore').textContent=`${sum.total} / 250`;$('globalMaturity').textContent=maturity(sum.average);$('domainSummary').innerHTML=domainSummary(sum);EXCELLENCE_DOMAINS.forEach((_,i)=>{let x=$(`domainScore-${i}`);if(x)x.textContent=`${sum.domain[i]} / 25`});$('radar').innerHTML=sum.domain.map((x,i)=>`<div><span>${i+1}</span><i style="height:${Math.max(5,x/25*100)}%"></i></div>`).join('');localStorage.biaExcellenceDraft=JSON.stringify(excellenceDraft)}
  function collectExcellence(){excellenceDraft.responsible=$('auditResponsible').value;excellenceDraft.auditor=$('auditAuditor').value;excellenceDraft.team=$('auditTeam').value;excellenceDraft.perimeter=$('auditPerimeter').value;excellenceDraft.strengths=$('auditStrengths').value;excellenceDraft.weaknesses=$('auditWeaknesses').value;excellenceDraft.opportunities=$('auditOpportunities').value;excellenceDraft.actions=$('auditActions').value;localStorage.biaExcellenceDraft=JSON.stringify(excellenceDraft)}
  function bindExcellence(){let open=()=>{$('excellenceForm').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};$('openExcellence')?.addEventListener('click',open);$('openExcellence2')?.addEventListener('click',open);$('closeExcellence')?.addEventListener('click',()=>{$('excellenceForm').hidden=true});$('saveDraft')?.addEventListener('click',()=>{collectExcellence();toast('Brouillon d’audit enregistré sur cet appareil.')});document.querySelectorAll('[data-audit-score]').forEach(el=>el.addEventListener('change',e=>{excellenceDraft.scores??={};excellenceDraft.scores[e.target.dataset.auditScore]=e.target.value;refreshExcellence()}));document.querySelectorAll('[data-audit-note]').forEach(el=>el.addEventListener('change',e=>{excellenceDraft.notes??={};excellenceDraft.notes[e.target.dataset.auditNote]=e.target.value;collectExcellence()}));document.querySelectorAll('[data-audit-priority]').forEach(el=>el.addEventListener('change',e=>{excellenceDraft.priorities??={};excellenceDraft.priorities[e.target.dataset.auditPriority]=e.target.value;collectExcellence()}));$('excellenceForm')?.addEventListener('submit',saveExcellence)}
  async function saveExcellence(e){e.preventDefault();collectExcellence();let sum=excellenceSummary(),site=$('auditSite').value,date=$('auditDate').value;let record={id:'local-audit-'+Date.now(),site_id:site,status:'termine',score:sum.total,notes:`Audit Excellence · ${$('auditPerimeter').value||'Périmètre non précisé'}`,performed_at:date+'T09:00:00',audit_data:excellenceDraft};data.audits.unshift(record);let priorities=Object.entries(excellenceDraft.priorities||{}).filter(([,p])=>p==='Rouge'||p==='Orange');for(let [key,p] of priorities){let [di,ci]=key.split('-').map(Number),a={id:'local-action-'+Date.now()+key,site_id:site,title:`Audit · ${EXCELLENCE_DOMAINS[di][0]} — ${EXCELLENCE_DOMAINS[di][1][ci]}`,owner:excellenceDraft.responsible||'À attribuer',priority:p==='Rouge'?'Haute':'Moyenne',status:'Ouverte',origin_type:'Audit',description:excellenceDraft.notes?.[key]||''};data.actions.unshift(a);let savedAction=await write('actions',{site_id:a.site_id,title:a.title,owner:a.owner,priority:a.priority,status:a.status,origin_type:a.origin_type,description:a.description});if(savedAction)Object.assign(a,savedAction)}render();let saved=await write('audits',{site_id:site,status:'termine',score:sum.total,notes:record.notes,performed_at:record.performed_at,audit_data:excellenceDraft,responsible_name:excellenceDraft.responsible,auditor_name:excellenceDraft.auditor,audit_team:excellenceDraft.team,perimeter:excellenceDraft.perimeter},'auditor_id');if(saved){Object.assign(record,saved);toast(`${priorities.length} action(s) créée(s) depuis l’audit.`)}else toast('Audit enregistré localement.');render()}
  </script>
</body></html>
