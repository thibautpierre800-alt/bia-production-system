# BIA Lean OS · nginx, à inclure dans le bloc http { }.
# La page et le service worker sont relus à chaque ouverture (chaque nouvelle version est prise) ;
# les autres fichiers portent un numéro de version (?v=…) et peuvent être gardés une semaine.
map $uri $bia_cache_control {
    ~/bia-lean-os/$                                    "no-cache";
    ~/(index\.html|service-worker\.js|manifest\.json)$  "no-cache";
    default                                            "public, max-age=604800";
}
