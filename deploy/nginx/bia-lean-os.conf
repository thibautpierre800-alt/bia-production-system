# BIA Lean OS · nginx. À inclure dans le bloc server { } HTTPS du nom d'hôte retenu,
# après avoir inclus bia-lean-os-map.conf dans le bloc http { }.
# Exemple pour une publication sous https://<hôte>/bia-lean-os/ ; le contenu de dist/ est copié
# dans /var/www/bia-lean-os/.

location = /bia-lean-os { return 301 /bia-lean-os/; }

location /bia-lean-os/ {
    alias /var/www/bia-lean-os/;
    index index.html;
    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
    }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $bia_cache_control always;
}
